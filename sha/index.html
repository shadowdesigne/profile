<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض أعمالنا الاحترافي</title>
    <style>
        :root {
            --primary-color: #800080; 
            --bg-color: #f8f9fa;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            width: 100%;
        }

        .logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 15px;
        }

        .main-title {
            color: var(--primary-color);
            font-size: 2.2rem;
            font-weight: 900;
            margin: 0;
        }

        .works-section {
            display: flex;
            flex-direction: column;
            gap: 150px;
            padding: 40px 20px;
            align-items: center;
            width: 100%;
        }

        .work-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* حاوية الكتاب تترك مساحة للأزرار */
        .book-wrapper {
            position: relative;
            padding: 0 70px; 
        }

        .book-container {
            position: relative;
            perspective: 2000px;
            margin: 0 auto;
        }

        .book {
            position: relative;
            transform-style: preserve-3d;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: left;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1), z-index 0.7s;
            cursor: pointer;
        }

        .page-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.1), 5px 0 15px rgba(0,0,0,0.2);
            background: white;
            border-radius: 0 10px 10px 0;
            overflow: hidden;
        }

        .page-face img {
            width: 100%;
            height: 100%;
            /* contain تضمن عدم قص الصورة أبداً */
            object-fit: contain; 
            pointer-events: none;
        }

        .back {
            transform: rotateY(180deg);
            border-radius: 10px 0 0 10px;
        }

        .flipped {
            transform: rotateY(-180deg);
        }

        .controls {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            width: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .nav-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 20px;
            pointer-events: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-btn:hover { background: #600060; transform: scale(1.1); }

        /* التجاوب مع الهاتف */
        @media (max-width: 768px) {
            .book-wrapper { padding: 0 45px; }
            .main-title { font-size: 1.8rem; }
            .nav-btn { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Logo" class="logo">
        <h1 class="main-title">أعمالنا</h1>
    </header>

    <div class="works-section">
        <!-- العمل الأول -->
        <div class="work-item">
            <div class="book-wrapper">
                <div class="controls">
                    <button class="nav-btn" onclick="prevPage('book1')">❯</button>
                    <button class="nav-btn" onclick="nextPage('book1')">❮</button>
                </div>
                <div class="book-container" id="container1">
                    <div class="book" id="book1"></div>
                </div>
            </div>
        </div>

        <!-- العمل الثاني -->
        <div class="work-item">
            <div class="book-wrapper">
                <div class="controls">
                    <button class="nav-btn" onclick="prevPage('book2')">❯</button>
                    <button class="nav-btn" onclick="nextPage('book2')">❮</button>
                </div>
                <div class="book-container" id="container2">
                    <div class="book" id="book2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات دقيقة لكل عمل
        const worksData = {
            book1: {
                prefix: "",      // 1.jpg, 2.jpg...
                count: 12,      // 12 صفحة
                width: "350px", // قياس طولي
                height: "500px"
            },
            book2: {
                prefix: "p",     // 1p.jpg, 2p.jpg...
                count: 16,      // 16 صفحة
                width: "500px", // قياس عرضي
                height: "350px"
            }
        };

        const bookStates = { book1: 0, book2: 0 };

        function initBooks() {
            for (let bookId in worksData) {
                const data = worksData[bookId];
                const bookElement = document.getElementById(bookId);
                const container = document.getElementById('container' + bookId.slice(-1));
                
                // تطبيق المقاسات الخاصة بكل كتاب على الحاوية
                container.style.width = data.width;
                container.style.height = data.height;
                bookElement.style.width = data.width;
                bookElement.style.height = data.height;

                const totalPages = Math.ceil(data.count / 2);

                for (let i = 0; i < totalPages; i++) {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.style.width = data.width;
                    pageDiv.style.height = data.height;
                    pageDiv.style.zIndex = totalPages - i;

                    const frontImg = `${i * 2 + 1}${data.prefix}.jpg`;
                    const backImg = `${i * 2 + 2}${data.prefix}.jpg`;

                    pageDiv.innerHTML = `
                        <div class="page-face front"><img src="${frontImg}" onerror="this.src='https://via.placeholder.com/${data.width}x${data.height}?text=Image+Missing'"></div>
                        <div class="page-face back"><img src="${backImg}" onerror="this.src='https://via.placeholder.com/${data.width}x${data.height}?text=Image+Missing'"></div>
                    `;

                    pageDiv.addEventListener('click', () => {
                        if (pageDiv.classList.contains('flipped')) prevPage(bookId);
                        else nextPage(bookId);
                    });

                    bookElement.appendChild(pageDiv);
                }
            }
        }

        function nextPage(bookId) {
            const book = document.getElementById(bookId);
            const pages = book.getElementsByClassName('page');
            const currentIndex = bookStates[bookId];

            if (currentIndex < pages.length) {
                const page = pages[currentIndex];
                page.classList.add('flipped');
                setTimeout(() => {
                    page.style.zIndex = currentIndex + 1;
                }, 300);
                bookStates[bookId]++;
            }
        }

        function prevPage(bookId) {
            const book = document.getElementById(bookId);
            const pages = book.getElementsByClassName('page');
            const currentIndex = bookStates[bookId];

            if (currentIndex > 0) {
                bookStates[bookId]--;
                const page = pages[bookStates[bookId]];
                page.classList.remove('flipped');
                setTimeout(() => {
                    page.style.zIndex = pages.length - bookStates[bookId];
                }, 300);
            }
        }

        // دعم السحب (Swipe) للهاتف
        let touchStartX = 0;
        let currentTouchBookId = null;

        document.querySelectorAll('.book').forEach(book => {
            book.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                currentTouchBookId = book.id;
            }, {passive: true});

            book.addEventListener('touchend', e => {
                const touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) nextPage(currentTouchBookId);
                    else prevPage(currentTouchBookId);
                }
            }, {passive: true});
        });

        window.onload = initBooks;
    </script>
</body>
</html>

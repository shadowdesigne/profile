<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بروفايل - معرض أعمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #800080; 
            --bg-gradient: radial-gradient(circle, #ffffff 0%, #e0e0e8 100%);
            --book-width: 40vw; 
            --book-height: 60vw; 
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Almarai', sans-serif;
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        header { 
            position: absolute;
            top: 20px;
            text-align: center; 
            width: 100%; 
            z-index: 10;
        }

        .logo { 
            max-width: 110px; 
            height: auto; 
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
        }

        .scene {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2500px;
        }

        .book {
            position: relative;
            width: var(--book-width);
            height: var(--book-height);
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform: translateX(0%); 
            max-width: 450px;
            max-height: 600px;
        }

        .book.open {
            transform: translateX(calc(var(--book-width) / 2));
        }

        /* الغلاف الخلفي الثابت - يجعله صفحة فردية في النهاية */
        .back-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: white;
            border-radius: 0 10px 10px 0;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.1), 10px 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .back-cover img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: left;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), z-index 0.6s;
            cursor: grab;
            user-select: none;
        }

        .page-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 5px 0 15px rgba(0,0,0,0.1);
            background: white;
            border-radius: 0 10px 10px 0;
            overflow: hidden;
        }

        .page-face img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .back {
            transform: rotateY(180deg);
            border-radius: 10px 0 0 10px;
        }

        .transparent-back {
            background: transparent !important;
            box-shadow: none !important;
        }

        .flipped {
            transform: rotateY(-180deg);
        }

        .controls {
            position: fixed;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 60px;
            z-index: 2000;
            pointer-events: none;
        }

        .nav-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 24px;
            pointer-events: auto;
            box-shadow: 0 8px 20px rgba(128, 0, 128, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .nav-btn:hover { transform: scale(1.1); background: #600060; }
        .nav-btn:active { transform: scale(0.9); }

        @media (max-width: 768px) {
            :root {
                --book-width: 46vw; 
                --book-height: 65vw; 
            }
            .book.open {
                transform: translateX(calc(var(--book-width) * 0.5)); 
            }
            header { top: 10px; }
            .logo { max-width: 90px; }
        }

        @media (min-width: 1600px) {
            :root {
                --book-width: 25vw;
                --book-height: 35vw;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Logo" class="logo">
        <!-- تم إزالة كلمة ثمار من هنا -->
    </header>

    <div class="scene">
        <div class="book" id="myBook">
            <!-- الغلاف الخلفي الثابت (صورة 12) - يجعل النهاية فردية مثل البداية -->
            <div class="back-cover">
                <img src="12.jpg" alt="Back Cover" onerror="this.src='https://via.placeholder.com/400x600?text=Page+12'">
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="nav-btn" onclick="prevPage()">❯</button>
        <button class="nav-btn" onclick="nextPage()">❮</button>
    </div>

    <script>
        const config = {
            prefix: "", 
            totalImages: 12, 
        };

        let currentPage = 0;
        const book = document.getElementById('myBook');
        const flippableImagesCount = config.totalImages - 1; 
        const totalSheets = Math.ceil(flippableImagesCount / 2);
        let pages = [];

        function initBook() {
            for (let i = 0; i < totalSheets; i++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                
                const frontImgNum = (i * 2) + 1;
                const backImgNum = (i * 2) + 2;

                let frontSrc = `${frontImgNum}${config.prefix}.jpg`;
                let backSrc = (backImgNum < config.totalImages) ? `${backImgNum}${config.prefix}.jpg` : '';

                const backClass = backSrc ? 'page-face back' : 'page-face back transparent-back';

                pageDiv.innerHTML = `
                    <div class="page-face front"><img src="${frontSrc}" onerror="this.src='https://via.placeholder.com/400x600?text=Page+${frontImgNum}'"></div>
                    <div class="${backClass}">
                        ${backSrc ? `<img src="${backSrc}" onerror="this.src='https://via.placeholder.com/400x600?text=Page+${backImgNum}'">` : ''}
                    </div>
                `;

                addTouchEvents(pageDiv, i);
                book.appendChild(pageDiv);
                pages.push(pageDiv);
            }
            refreshZIndexes();
        }

        function refreshZIndexes() {
            pages.forEach((page, index) => {
                if (index < currentPage) {
                    page.style.zIndex = index + 1;
                } else {
                    page.style.zIndex = totalSheets - index;
                }
            });
        }

        function updateBookStatus() {
            if (currentPage > 0) {
                book.classList.add('open');
            } else {
                book.classList.remove('open');
            }
            refreshZIndexes();
        }

        function nextPage() {
            if (currentPage < totalSheets) {
                pages[currentPage].classList.add('flipped');
                currentPage++;
                updateBookStatus();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                pages[currentPage].classList.remove('flipped');
                updateBookStatus();
            }
        }

        function addTouchEvents(element, index) {
            let startX = 0;
            let currentRotation = 0;

            element.addEventListener('touchstart', e => {
                startX = e.touches[0].clientX;
                if (index !== currentPage) return;
            }, {passive: true});

            element.addEventListener('touchmove', e => {
                if (index !== currentPage) return;
                const moveX = e.touches[0].clientX;
                const diff = startX - moveX;
                
                if (!element.classList.contains('flipped')) {
                    currentRotation = Math.max(-180, diff * 0.7); 
                    element.style.transition = 'none';
                    element.style.transform = `rotateY(${currentRotation}deg)`;
                } else {
                    currentRotation = Math.min(0, -diff * 0.7);
                    element.style.transition = 'none';
                    element.style.transform = `rotateY(${currentRotation}deg)`;
                }
            }, {passive: true});

            element.addEventListener('touchend', e => {
                if (index !== currentPage) return;
                element.style.transition = 'transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1)';
                if (!element.classList.contains('flipped')) {
                    if (currentRotation < -90) nextPage();
                    else element.style.transform = `rotateY(0deg)`;
                } else {
                    if (currentRotation > -90) prevPage();
                    else element.style.transform = `rotateY(-180deg)`;
                }
                currentRotation = 0;
            });
        }

        window.onload = initBook;
    </script>
</body>
</html>

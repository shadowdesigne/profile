<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ثمار الخير - بروفايل</title>
    
    <!-- استيراد خط المراعي -->
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #800080; 
            --bg-color: #fdfdfd;
            /* تحديد عرض الكتاب ليكون مرناً */
            --book-width: 80vw; 
            --max-book-width: 380px;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Almarai', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden; 
            width: 100%;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 30px 15px;
            width: 100%;
        }

        .logo {
            max-width: 140px;
            height: auto;
            margin-bottom: 15px;
        }

        .main-title {
            color: var(--primary-color);
            font-family: 'Almarai', sans-serif;
            font-weight: 800;
            font-size: clamp(1.6rem, 6vw, 2.4rem);
            margin: 0;
        }

        .works-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0 80px 0;
            width: 100%;
        }

        /* الحاوية الخارجية لضمان عدم خروج العناصر عن الشاشة */
        .book-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 50px; /* مساحة جانبية للأزرار */
        }

        .book-container {
            position: relative;
            perspective: 1500px;
            width: var(--book-width);
            max-width: var(--max-book-width);
            /* النسبة الذهبية للكتاب الطولي (3:4) */
            aspect-ratio: 3 / 4; 
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: left;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1), z-index 0.7s;
            cursor: pointer;
        }

        .page-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 5px 0 10px rgba(0,0,0,0.1);
            background: white;
            border-radius: 0 8px 8px 0;
            overflow: hidden;
        }

        .page-face img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            pointer-events: none;
        }

        .back {
            transform: rotateY(180deg);
            border-radius: 8px 0 0 8px;
        }

        .flipped {
            transform: rotateY(-180deg);
        }

        /* الأزرار - تم تحسين وضعيتها لتكون بعيدة عن الكتاب */
        .controls {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            width: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .nav-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 20px;
            pointer-events: auto;
            box-shadow: 0 4px 12px rgba(128, 0, 128, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .nav-btn:active { transform: scale(0.9); }

        /* تحسينات الموبايل */
        @media (max-width: 480px) {
            .book-wrapper {
                padding: 0 40px;
            }
            .book-container {
                width: 85vw; /* زيادة عرض الكتاب قليلاً في الشاشات الصغيرة جداً */
            }
            .nav-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Logo" class="logo">
        <h1 class="main-title">ثمار الخير</h1>
    </header>

    <div class="works-section">
        <div class="work-item">
            <div class="book-wrapper">
                <div class="controls">
                    <button class="nav-btn" onclick="prevPage()">❯</button>
                    <button class="nav-btn" onclick="nextPage()">❮</button>
                </div>
                <div class="book-container">
                    <div class="book" id="mainBook"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات العمل الوحيد
        const config = {
            prefix: "", 
            count: 12, // ينتهي عند 12.jpg
        };

        let currentPageIndex = 0;

        function initBook() {
            const bookElement = document.getElementById('mainBook');
            const totalPages = Math.ceil(config.count / 2);

            for (let i = 0; i < totalPages; i++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageDiv.style.zIndex = totalPages - i;

                const frontImg = `${i * 2 + 1}${config.prefix}.jpg`;
                const backImg = `${i * 2 + 2}${config.prefix}.jpg`;

                pageDiv.innerHTML = `
                    <div class="page-face front"><img src="${frontImg}" onerror="this.src='https://via.placeholder.com/400x600?text=Page+${i*2+1}'"></div>
                    <div class="page-face back"><img src="${backImg}" onerror="this.src='https://via.placeholder.com/400x600?text=Page+${i*2+2}'"></div>
                `;

                pageDiv.addEventListener('click', () => {
                    if (pageDiv.classList.contains('flipped')) prevPage();
                    else nextPage();
                });

                bookElement.appendChild(pageDiv);
            }
        }

        function nextPage() {
            const pages = document.getElementsByClassName('page');
            if (currentPageIndex < pages.length) {
                const page = pages[currentPageIndex];
                page.classList.add('flipped');
                setTimeout(() => { page.style.zIndex = currentPageIndex + 1; }, 300);
                currentPageIndex++;
            }
        }

        function prevPage() {
            const pages = document.getElementsByClassName('page');
            if (currentPageIndex > 0) {
                currentPageIndex--;
                const page = pages[currentPageIndex];
                page.classList.remove('flipped');
                setTimeout(() => { page.style.zIndex = pages.length - currentPageIndex; }, 300);
            }
        }

        // دعم السحب باليد للهاتف
        let touchStartX = 0;
        document.getElementById('mainBook').addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        document.getElementById('mainBook').addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextPage();
                else prevPage();
            }
        }, {passive: true});

        window.onload = initBook;
    </script>
</body>
</html>

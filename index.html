<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عرض البروفايل التفاعلي</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e1e26 0%, #0a0a0e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Almarai', sans-serif;
            cursor: none; /* إخفاء الماوس للشاشات الدعائية */
        }

        /* الشعار العلوي (يظهر بشكل أنيق ولا يأخذ من مساحة العرض) */
        .brand-logo {
            position: fixed;
            top: 1.2vh;
            z-index: 1000;
            max-height: 4.5vh;
            max-width: 35vw;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
            pointer-events: none;
        }

        /* مسرح العرض ثلاثي الأبعاد */
        .scene {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2600px;
            position: relative;
            overflow: hidden;
        }

        /* حاوية الصفحة الواحدة - يتم ضبط أبعادها تلقائياً بالجافاسكريبت لمنع أي اقتطاع */
        .book {
            position: relative;
            transform-style: preserve-3d;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
        }

        /* الورقة */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            border-radius: 12px;
            will-change: transform, opacity;
        }

        /* أوجه الورقة */
        .page-face {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
        }

        .page-face img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ضمان عدم اقتطاع أي جزء من الأجناب نهائياً */
            display: block;
            pointer-events: none;
        }

        /* ظهر الورقة أثناء الانطواء ليمنح إحساس الورق الحقيقي قبل تلاشيه */
        .page-face.back {
            transform: rotateY(180deg);
            background: #f4f4f8;
        }

        .page-face.back img {
            transform: scaleX(-1);
            filter: brightness(0.88) contrast(0.85) blur(1px);
            opacity: 0.35;
        }

        /* طبقة الإضاءة والظل الديناميكي على الورقة أثناء التقليب */
        .curl-lighting {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(
                to right,
                rgba(0, 0, 0, 0.45) 0%,
                rgba(0, 0, 0, 0.12) 15%,
                rgba(255, 255, 255, 0.28) 45%,
                rgba(0, 0, 0, 0.08) 80%,
                rgba(0, 0, 0, 0.30) 100%
            );
            transition: opacity 0.4s ease;
        }

        /* ظل كعب الكتاب الداخلي */
        .spine-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.22), transparent);
            pointer-events: none;
            z-index: 3;
        }

        /* الظل الساقط على الصفحة الجديدة بالأسفل أثناء التقليب */
        .under-shadow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(
                to right,
                rgba(0, 0, 0, 0.65) 0%,
                rgba(0, 0, 0, 0.25) 35%,
                transparent 75%
            );
            z-index: 4;
        }

        /* أنيميشن التقليب الواقعي للأمام (180 درجة مع انحناء وتلاشي جانبي لمنع ظهور الورقة المقلوبة) */
        @keyframes realisticFlipForward {
            0% {
                transform: rotateY(0deg) rotateZ(0deg) scaleY(1);
                opacity: 1;
            }
            35% {
                transform: rotateY(-65deg) rotateZ(-1.2deg) scaleY(1.018);
                opacity: 1;
            }
            65% {
                transform: rotateY(-120deg) rotateZ(-0.8deg) scaleY(1.01);
                opacity: 1;
            }
            88% {
                transform: rotateY(-165deg) rotateZ(0deg) scaleY(1);
                opacity: 0;
            }
            100% {
                transform: rotateY(-180deg) rotateZ(0deg) scaleY(1);
                opacity: 0;
            }
        }

        /* أنيميشن إضاءة انحناء الورقة */
        @keyframes curlLightPulse {
            0% { opacity: 0; }
            35% { opacity: 1; }
            75% { opacity: 0.7; }
            100% { opacity: 0; }
        }

        /* أنيميشن الظل الساقط على الصفحة التالية */
        @keyframes castShadowSweep {
            0% { opacity: 0; }
            25% { opacity: 0.9; }
            65% { opacity: 0.4; }
            100% { opacity: 0; }
        }

        /* أنيميشن الفرّ السريع للرجوع إلى أول صفحة */
        @keyframes realisticRewindFlip {
            0% {
                transform: rotateY(-180deg) rotateZ(0deg) scaleY(1);
                opacity: 0;
            }
            20% {
                transform: rotateY(-140deg) rotateZ(-1deg) scaleY(1.015);
                opacity: 1;
            }
            60% {
                transform: rotateY(-55deg) rotateZ(-0.8deg) scaleY(1.01);
                opacity: 1;
            }
            100% {
                transform: rotateY(0deg) rotateZ(0deg) scaleY(1);
                opacity: 1;
            }
        }

        .page.flipping-forward {
            animation: realisticFlipForward 1.35s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
            pointer-events: none;
        }

        .page.flipping-forward .curl-lighting {
            animation: curlLightPulse 1.35s ease-in-out forwards;
        }

        .page.flipped-done {
            transform: rotateY(-180deg);
            opacity: 0;
            pointer-events: none;
        }

        .page.rewinding {
            animation: realisticRewindFlip 0.48s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .page.shadow-target .under-shadow {
            animation: castShadowSweep 1.35s ease-out forwards;
        }

        /* تحسين المنظور على الهواتف المحمولة والشاشات الصغيرة */
        @media (max-width: 768px) {
            .scene {
                perspective: 1800px;
            }
            .book, .page, .page-face {
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">

    <div class="scene">
        <div class="book" id="myBook"></div>
    </div>

    <script>
        const config = {
            prefix: "",
            totalImages: 12,        // إجمالي عدد الصفحات
            autoFlipDelay: 4000,    // مدة عرض كل صفحة (4 ثوانٍ)
            rewindStagger: 95,      // سرعة تتابع فرّ الصفحات عند العودة للبداية (بالملي ثانية)
            defaultAspectRatio: 0.707 // النسبة الافتراضية (A4 طولي) إلى أن يتم قراءة أبعاد الصورة الفعلية
        };

        const book = document.getElementById('myBook');
        let pages = [];
        let currentPage = 0;
        let pageAspectRatio = config.defaultAspectRatio;
        let autoFlipTimer = null;
        let isRewinding = false;

        // دالة ذكية لضبط مقاس الصفحة لتكبيرها لأقصى حد في جميع الشاشات (طولية أو عرضية أو موبايل) بدون أي اقتطاع
        function adjustBookDimensions() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const isMobile = vw <= 768;
            const isPortraitScreen = vh > vw;

            // استغلال 96% من المساحة على الشاشات الطولية والهواتف لتكون الصفحة مكبرة وواضحة
            const maxWidthRatio = (isPortraitScreen || isMobile) ? 0.96 : 0.90;
            const maxHeightRatio = (isPortraitScreen || isMobile) ? 0.94 : 0.93;

            const maxAllowedWidth = vw * maxWidthRatio;
            const maxAllowedHeight = vh * maxHeightRatio;

            let finalWidth = maxAllowedWidth;
            let finalHeight = finalWidth / pageAspectRatio;

            if (finalHeight > maxAllowedHeight) {
                finalHeight = maxAllowedHeight;
                finalWidth = finalHeight * pageAspectRatio;
            }

            book.style.width = `${Math.round(finalWidth)}px`;
            book.style.height = `${Math.round(finalHeight)}px`;
        }

        // قراءة النسبة الحقيقية لأول صورة لضمان عدم وجود أي حواف فارغة أو اقتطاع
        function detectImageAspectRatio() {
            const probeImg = new Image();
            probeImg.onload = function () {
                if (this.naturalWidth && this.naturalHeight) {
                    pageAspectRatio = this.naturalWidth / this.naturalHeight;
                    adjustBookDimensions();
                }
            };
            probeImg.src = `1${config.prefix}.jpg`;
        }

        function initBook() {
            book.innerHTML = '';
            pages = [];

            for (let i = 0; i < config.totalImages; i++) {
                const pageNum = i + 1;
                const imgSrc = `${pageNum}${config.prefix}.jpg`;
                const placeholder = `https://via.placeholder.com/1080x1527/ffffff/800080?text=Page+${pageNum}`;

                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                // الصفحة الأولى تكون في الأعلى (أعلى z-index) وتتناقص تدريجياً
                pageDiv.style.zIndex = config.totalImages - i;

                pageDiv.innerHTML = `
                    <div class="page-face front">
                        <img src="${imgSrc}" alt="صفحة ${pageNum}" onerror="this.src='${placeholder}'">
                        <div class="spine-shadow"></div>
                        <div class="curl-lighting"></div>
                        <div class="under-shadow"></div>
                    </div>
                    <div class="page-face back">
                        <img src="${imgSrc}" alt="" onerror="this.src='${placeholder}'">
                        <div class="curl-lighting"></div>
                    </div>
                `;

                book.appendChild(pageDiv);
                pages.push(pageDiv);
            }

            adjustBookDimensions();
            detectImageAspectRatio();
            startAutoLoop();
        }

        // تقليب الصفحة الحالية للكشف عن الصفحة التي تليها
        function flipNextPage() {
            if (isRewinding) return;

            // إذا لم نصل لآخر صفحة بعد، نقلب الصفحة الحالية
            if (currentPage < config.totalImages - 1) {
                const activePage = pages[currentPage];
                const nextPage = pages[currentPage + 1];

                activePage.classList.remove('rewinding', 'flipped-done');
                activePage.classList.add('flipping-forward');

                // تفعيل الظل الساقط على الصفحة الجديدة بالأسفل لزيادة الواقعية
                if (nextPage) {
                    nextPage.classList.remove('shadow-target');
                    void nextPage.offsetWidth; // إعادة تفعيل الأنيميشن
                    nextPage.classList.add('shadow-target');
                }

                // تثبيت حالة الإخفاء بعد انتهاء حركة الـ 180 درجة
                setTimeout(() => {
                    if (activePage.classList.contains('flipping-forward')) {
                        activePage.classList.remove('flipping-forward');
                        activePage.classList.add('flipped-done');
                    }
                    if (nextPage) {
                        nextPage.classList.remove('shadow-target');
                    }
                }, 1350);

                currentPage++;
            } else {
                // وصلنا لآخر صفحة (صفحة 12): نوقف المؤقت ونفرّ الصفحات سريعاً لأول صفحة
                clearInterval(autoFlipTimer);
                rewindToFirstPage();
            }
        }

        // فرّ جميع الصفحات سريعاً للخلف للعودة إلى الصفحة الأولى
        function rewindToFirstPage() {
            isRewinding = true;
            let pageIndex = config.totalImages - 2; // نبدأ من الصفحة قبل الأخيرة حتى الأولى

            const rewindInterval = setInterval(() => {
                if (pageIndex >= 0) {
                    const p = pages[pageIndex];
                    p.classList.remove('flipping-forward', 'flipped-done', 'shadow-target');
                    p.classList.add('rewinding');

                    // تنظيف كلاس الرجوع بعد انتهاء الحركة
                    setTimeout(() => {
                        p.classList.remove('rewinding');
                    }, 500);

                    pageIndex--;
                } else {
                    clearInterval(rewindInterval);
                    setTimeout(() => {
                        currentPage = 0;
                        isRewinding = false;
                        startAutoLoop();
                    }, 600);
                }
            }, config.rewindStagger);
        }

        function startAutoLoop() {
            clearInterval(autoFlipTimer);
            autoFlipTimer = setInterval(flipNextPage, config.autoFlipDelay);
        }

        // تحديث المقاسات فوراً عند تدوير الهاتف أو تغيير حجم الشاشة
        window.addEventListener('resize', adjustBookDimensions);
        window.addEventListener('orientationchange', () => setTimeout(adjustBookDimensions, 150));
        window.onload = initBook;
    </script>
</body>
</html>

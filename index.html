<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ثمار - بروفايل</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #800080; 
            --bg-color: #f4f4f9;
            --book-width: 350px; 
            --book-height: 480px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: 'Almarai', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
        }

        header { text-align: center; padding: 20px 15px; width: 100%; }
        .logo { max-width: 120px; height: auto; margin-bottom: 10px; }
        .main-title {
            color: var(--primary-color);
            font-weight: 800;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
        }

        /* حاوية العمل */
        .scene {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            perspective: 2000px;
        }

        .book {
            position: relative;
            width: var(--book-width);
            height: var(--book-height);
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            /* لجعل الكتاب يتوسط الشاشة عند الفتح */
            transform: translateX(0%); 
        }

        /* حالة الكتاب عندما يكون مفتوحاً (يتحرك لليمين ليظهر الصفحتان في المنتصف) */
        .book.open {
            transform: translateX(calc(var(--book-width) / 2));
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: left;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), z-index 0.6s;
            cursor: grab;
            user-select: none;
        }

        .page:active { cursor: grabbing; }

        .page-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 5px 0 15px rgba(0,0,0,0.1);
            background: white;
            border-radius: 0 10px 10px 0;
            overflow: hidden;
        }

        .page-face img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .back {
            transform: rotateY(180deg);
            border-radius: 10px 0 0 10px;
        }

        /* التقليب */
        .flipped {
            transform: rotateY(-180deg);
        }

        /* الأزرار */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            z-index: 2000;
            pointer-events: none;
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 22px;
            pointer-events: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        /* الهاتف المحمول - التعديلات الجذرية */
        @media (max-width: 768px) {
            :root {
                --book-width: 42vw; /* جعل عرض الصفحة الواحدة أقل من نصف الشاشة */
                --book-height: 60vw; /* تناسب الطول مع العرض */
            }
            .book.open {
                /* تحريك دقيق ليظهر الصفحتان في المنتصف تماماً */
                transform: translateX(calc(var(--book-width) * 0.5)); 
            }
            .main-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Logo" class="logo">
        <h1 class="main-title">ثمار</h1>
    </header>

    <div class="scene">
        <div class="book" id="myBook">
            <!-- الصفحات يتم إنشاؤها بواسطة JS -->
        </div>
    </div>

    <div class="controls">
        <button class="nav-btn" onclick="prevPage()">❯</button>
        <button class="nav-btn" onclick="nextPage()">❮</button>
    </div>

    <script>
        const config = {
            prefix: "", 
            count: 12, 
        };

        let currentPage = 0;
        const book = document.getElementById('myBook');
        const totalPages = Math.ceil(config.count / 2);
        let pages = [];

        function initBook() {
            for (let i = 0; i < totalPages; i++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageDiv.style.zIndex = totalPages - i;

                const frontImg = `${i * 2 + 1}${config.prefix}.jpg`;
                const backImg = `${i * 2 + 2}${config.prefix}.jpg`;

                pageDiv.innerHTML = `
                    <div class="page-face front"><img src="${frontImg}" onerror="this.src='https://via.placeholder.com/400x600?text=Page+${i*2+1}'"></div>
                    <div class="page-face back"><img src="${backImg}" onerror="this.src='https://via.placeholder.com/400x600?text=Page+${i*2+2}'"></div>
                `;

                // إضافة أحداث اللمس للتقليب الواقعي
                addTouchEvents(pageDiv, i);

                book.appendChild(pageDiv);
                pages.push(pageDiv);
            }
        }

        function updateBookStatus() {
            // إذا كان الكتاب مفتوحاً (صفحة واحدة على الأقل مقلوبة)
            if (currentPage > 0) {
                book.classList.add('open');
            } else {
                book.classList.remove('open');
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                pages[currentPage].classList.add('flipped');
                pages[currentPage].style.zIndex = currentPage + 1;
                currentPage++;
                updateBookStatus();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                pages[currentPage].classList.remove('flipped');
                pages[currentPage].style.zIndex = totalPages - currentPage;
                updateBookStatus();
            }
        }

        // --- منطق التقليب الواقعي باليد (Drag to Flip) ---
        function addTouchEvents(element, index) {
            let startX = 0;
            let currentRotation = 0;

            element.addEventListener('touchstart', e => {
                startX = e.touches[0].clientX;
                // إذا كانت الصفحة مقلوبة، نمنع حركتها إلا إذا كانت هي الصفحة الحالية للرجوع
                if (index !== currentPage) return;
            }, {passive: true});

            element.addEventListener('touchmove', e => {
                if (index !== currentPage) return;
                
                const moveX = e.touches[0].clientX;
                const diff = startX - moveX;
                
                // تحويل المسافة إلى زاوية دوران (من 0 إلى -180 درجة)
                if (!element.classList.contains('flipped')) {
                    currentRotation = Math.max(-180, diff * 0.5); 
                    element.style.transition = 'none';
                    element.style.transform = `rotateY(${currentRotation}deg)`;
                } else {
                    // حالة الرجوع للخلف
                    currentRotation = Math.min(0, -diff * 0.5);
                    element.style.transition = 'none';
                    element.style.transform = `rotateY(${currentRotation}deg)`;
                }
            }, {passive: true});

            element.addEventListener('touchend', e => {
                if (index !== currentPage) return;
                
                element.style.transition = 'transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1)';
                
                if (!element.classList.contains('flipped')) {
                    if (currentRotation < -90) {
                        nextPage();
                    } else {
                        element.style.transform = `rotateY(0deg)`;
                    }
                } else {
                    if (currentRotation > -90) {
                        prevPage();
                    } else {
                        element.style.transform = `rotateY(-180deg)`;
                    }
                }
                currentRotation = 0;
            });
        }

        window.onload = initBook;
    </script>
</body>
</html>
